# Project-wide Gradle Performance Settings for 32GB RAM System
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m -XX:+ParallelRefProcEnabled -XX:G1HeapRegionSize=16m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true

# Kotlin Compiler Performance Flags
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true
ksp.incremental=true

# Android Gradle Plugin Optimizations
android.useAndroidX=true
android.enableJetifier=false
android.nonFinalResIds=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
